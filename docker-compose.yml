services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cfpb-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cfpb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cfpb_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-cfpb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cfpb} -d ${POSTGRES_DB:-cfpb}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
